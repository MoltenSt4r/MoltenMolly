name: Sync Upstream

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - run: |
          if ! git show-ref --verify --quiet refs/remotes/origin/upstream-main; then
            echo "::notice::Branch upstream-main does not exist in this fork; skipping sync."
            exit 0
          fi
          git checkout -B upstream-main origin/upstream-main
          gh auth setup-git
          git remote add upstream https://github.com/signalapp/Signal-Android.git
          git pull --ff-only upstream main
          git fetch --tags upstream
          git lfs fetch --all upstream
          git push origin upstream-main
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: 1
